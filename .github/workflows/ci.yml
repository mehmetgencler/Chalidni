name: Scientific Verification & Build CI

on:
  push:
    branches: [ main, 'feat/*', 'fix/*' ]
  pull_request:
    branches: [ main ]

jobs:
  scientific-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Unit Tests (Physics & Clock Synchronization)
        run: npm run test

      - name: Independent Scientific Audit Execution
        run: npm run audit

      - name: Production Bundle Build (Vite)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Real Browser E2E Verification (AudioWorklet, File Downmix, Mobile Perf)
        run: npm run test:e2e
